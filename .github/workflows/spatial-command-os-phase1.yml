name: Spatial Command OS Phase 1

on:
  push:
    branches:
      - work/spatial-command-os-20261005
    paths:
      - scripts/apply_spatial_command_os_phase1.py
      - tests/test_spatial_command_os_acceptance.py
      - .github/workflows/spatial-command-os-phase1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spatial-command-os-phase1
  cancel-in-progress: false

jobs:
  source-repair-and-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated source branch
        uses: actions/checkout@v4
        with:
          ref: work/spatial-command-os-20261005
          fetch-depth: 0

      - name: Confirm audit-only branch
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "work/spatial-command-os-20261005"
          echo "KRISHNA live/runtime deployment is not part of this workflow."

      - name: Apply Phase-1 SOURCE repair
        run: python scripts/apply_spatial_command_os_phase1.py

      - name: Run Spatial Command OS acceptance contract
        run: python -m unittest tests.test_spatial_command_os_acceptance -v

      - name: Run current canonical UI contract
        run: python -m unittest tests.test_current_krishna_ui_contract -v

      - name: Check patch integrity
        shell: bash
        run: |
          git diff --check
          git status --short

      - name: Commit verified SOURCE-only transformation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source transformation to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/web_validation.html app/spatial-ui/src/App.tsx
          git commit -m "fix: apply Spatial Command OS phase-1 source repair"
          git push origin HEAD:work/spatial-command-os-20261005
