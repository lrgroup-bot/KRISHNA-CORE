name: SURYADEV Real Source Smoke
on:
  pull_request:
    paths:
      - 'standalone/suryadev/live_smoke.py'
      - 'standalone/suryadev/parallel_smoke.py'
      - 'standalone/suryadev/dashboard_ui_smoke.py'
      - 'standalone/suryadev/suryadev_ingest.py'
      - '.github/workflows/suryadev-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free PDF and YouTube readers
        run: python -m pip install --disable-pip-version-check pypdf yt-dlp playwright psutil
      - name: Install isolated Garudanetra Chromium engine
        run: python -m playwright install chromium
      - name: Exercise public website, PDF and caption pipelines with real inputs
        working-directory: standalone/suryadev
        run: python -u live_smoke.py
      - name: Verify two concurrent real Garudanetra browser tabs with PDF processing
        working-directory: standalone/suryadev
        run: python -u parallel_smoke.py
      - name: Verify rendered v6 dashboard source counts and clickable workspaces
        working-directory: standalone/suryadev
        run: python -u dashboard_ui_smoke.py
