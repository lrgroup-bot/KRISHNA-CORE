name: SUDARSHAN Canonical Integration
on:
  push:
    branches:
      - feature/sudarshan-canonical-integration-20261018
  pull_request:
    paths:
      - 'core/krishna_core/sudarshan_canonical_integration.py'
      - 'core/krishna_core/sudarshan_owner_consent.py'
      - 'core/krishna_core/orchestrator.py'
      - 'core/tests/test_sudarshan_canonical_integration.py'
      - 'core/tests/test_sudarshan_owner_consent.py'
      - '.github/workflows/sudarshan-canonical-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed Python modules
        run: python -m py_compile core/krishna_core/sudarshan_canonical_integration.py core/krishna_core/sudarshan_owner_consent.py core/krishna_core/orchestrator.py core/tests/test_sudarshan_canonical_integration.py core/tests/test_sudarshan_owner_consent.py
      - name: Verify action bus, project authority and knowledge handoffs
        env:
          PYTHONPATH: core
        run: |
          python -m unittest discover -s core/tests -p 'test_sudarshan_canonical_integration.py' -v
          python -m unittest discover -s core/tests -p 'test_sudarshan_owner_consent.py' -v
