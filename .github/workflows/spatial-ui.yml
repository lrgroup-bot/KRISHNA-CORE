name: KRISHNA Spatial UI

on:
  pull_request:
    paths:
      - "app/spatial-ui/**"
      - "core/tests/test_operational_dashboard_ui.py"
      - ".github/workflows/spatial-ui.yml"
  push:
    branches:
      - "fix/krishna-ui-runtime-verification"
      - "fix/krishna-dashboard-operational-ui"
    paths:
      - "app/spatial-ui/**"
      - "core/tests/test_operational_dashboard_ui.py"
      - ".github/workflows/spatial-ui.yml"

permissions:
  contents: read

jobs:
  build-spatial-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/spatial-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/spatial-ui/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check operational dashboard JavaScript
        run: node --check public/operational-dashboard.js
      - name: Build
        run: npm run build
      - name: Verify candidate output
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/legacy-dashboard.html
          test -f dist/operational-dashboard.css
          test -f dist/operational-dashboard.js
          test -f dist/operational-preview.html
      - name: Install UI contract test dependency
        working-directory: .
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify owner-readable dashboard contract
        working-directory: .
        run: python -m pytest -q core/tests/test_operational_dashboard_ui.py
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start built candidate preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/krishna-ui-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/operational-preview.html | grep -q "candidateState"; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/krishna-ui-preview.log
          exit 1
      - name: Click every operational system dashboard in Chromium
        run: npx playwright test operational-dashboard.spec.mjs --reporter=line
      - name: Upload candidate screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krishna-operational-dashboard-candidate
          path: app/spatial-ui/spatial-command-os-candidate.png
          if-no-files-found: warn
          retention-days: 7
