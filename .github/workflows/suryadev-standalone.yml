name: SURYADEV Standalone Checks
on:
  pull_request:
    paths:
      - 'standalone/suryadev/**'
      - '.github/workflows/suryadev-standalone.yml'
  push:
    paths:
      - 'standalone/suryadev/**'
      - '.github/workflows/suryadev-standalone.yml'
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all modules
        run: python -m compileall -q standalone/suryadev
      - name: Run tests
        working-directory: standalone/suryadev
        run: python -m unittest discover -s tests -v
