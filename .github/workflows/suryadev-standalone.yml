name: SURYADEV Standalone Checks
on:
  pull_request:
    paths:
      - 'standalone/suryadev/**'
      - '.github/workflows/suryadev-standalone.yml'
      - 'core/krishna_core/suryadev.py'
      - 'core/krishna_core/suryadev_mission_backlog.py'
      - 'core/krishna_core/server.py'
      - 'core/krishna_core/remote_access.py'
      - 'core/tests/test_suryadev_mission_backlog.py'
  push:
    paths:
      - 'standalone/suryadev/**'
      - '.github/workflows/suryadev-standalone.yml'
      - 'core/krishna_core/suryadev.py'
      - 'core/krishna_core/suryadev_mission_backlog.py'
      - 'core/krishna_core/server.py'
      - 'core/krishna_core/remote_access.py'
      - 'core/tests/test_suryadev_mission_backlog.py'
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all modules
        run: python -m compileall -q standalone/suryadev
      - name: Run tests
        working-directory: standalone/suryadev
        run: python -m unittest discover -s tests -v
      - name: Validate unified dashboard JavaScript syntax
        run: |
          node --check standalone/suryadev/dashboard-api.js
          node --check standalone/suryadev/dashboard.js
          node --check standalone/suryadev/dashboard-video.js
          node --check standalone/suryadev/dashboard-books.js
          node --check standalone/suryadev/dashboard-garudanetra.js
          node --check standalone/suryadev/dashboard-learning.js
          node --check standalone/suryadev/dashboard-settings.js
          node --check standalone/suryadev/dashboard-ai-learner.js
          node --check standalone/suryadev/dashboard-pages.js

      - name: Verify Core six-hour mission scheduler and paired route contract
        env:
          PYTHONPATH: core
        run: python -m unittest discover -s core/tests -p test_suryadev_mission_backlog.py -v

      - name: Verify installer diagnostic test gate
        working-directory: standalone/suryadev
        run: python install_test_gate.py --source .

      - name: Validate Windows laptop preflight PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'standalone/suryadev/laptop-preflight.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'standalone/suryadev/install-windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'standalone/suryadev/start-continuous-learning.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'standalone/suryadev/start-fresh-workspace.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'standalone/suryadev/VERIFY_AI_LEARNER_WINDOWS.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

  ui-browser:
    name: Chromium unified frontend smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local browser smoke prerequisites
        run: |
          python -m pip install playwright psutil
          python -m playwright install --with-deps chromium
      - name: Test actual unified dashboard in Chromium
        working-directory: standalone/suryadev
        run: python dashboard_ui_smoke.py
