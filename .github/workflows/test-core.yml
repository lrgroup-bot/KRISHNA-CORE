name: Test KRISHNA Core
on:
  push:
    paths: ['core/**', 'tests/**', 'scripts/**', '.github/workflows/test-core.yml']
  pull_request:
    paths: ['core/**', 'tests/**', 'scripts/**', '.github/workflows/test-core.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile all Python sources
        run: python -m compileall -q core tests
      - name: Run KRISHNA architecture audit
        run: python scripts/AUDIT_KRISHNA_ARCHITECTURE.py --out architecture-audit.json
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed=@()
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors){ $failed += ($_.FullName + ": " + (($errors | ForEach-Object Message) -join " | ")) }
          }
          if($failed.Count){ $failed | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Unit and isolated HTTP integration tests
        working-directory: core
        run: python -m unittest discover -s tests -v
      - name: Repository contracts
        run: python -m unittest discover -s tests -v

  privacy-browser-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Run real KABACH browser privacy E2E
        working-directory: core
        env:
          KRISHNA_PRIVACY_BROWSER_E2E: '1'
        run: python -m unittest tests.test_privacy_browser_e2e -v

  project-perfection-browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Project Perfection browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
          mkdir -p .axe
          npm --prefix .axe init -y
          npm --prefix .axe install axe-core@4 --no-audit --no-fund
      - name: Run real Project Perfection Chromium E2E
        working-directory: core
        env:
          KRISHNA_PROJECT_PERFECTION_BROWSER_E2E: '1'
          KRISHNA_AXE_CORE_JS: ${{ github.workspace }}/.axe/node_modules/axe-core/axe.min.js
        run: python -m unittest tests.test_project_perfection_browser_e2e -v
