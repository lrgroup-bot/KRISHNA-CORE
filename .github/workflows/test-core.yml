name: Test KRISHNA Core
on:
  push:
    paths: ['core/**', 'tests/**', 'scripts/**', '.github/workflows/test-core.yml']
  pull_request:
    paths: ['core/**', 'tests/**', 'scripts/**', '.github/workflows/test-core.yml']
jobs:
  core-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile all Python sources
        run: python -m compileall -q core tests
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed=@()
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors){ $failed += ($_.FullName + ": " + (($errors | ForEach-Object Message) -join " | ")) }
          }
          if($failed.Count){ $failed | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Unit and isolated HTTP integration tests
        working-directory: core
        run: python -m unittest discover -s tests -v
      - name: Repository contracts
        run: python -m unittest discover -s tests -v
