name: Test KRISHNA Core
on:
  push:
    paths: ['core/**', 'tests/**', 'scripts/**', '.github/workflows/test-core.yml']
  pull_request:
    paths: ['core/**', 'tests/**', 'scripts/**', '.github/workflows/test-core.yml']
jobs:
  core-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Core
        run: python -m compileall -q core/krishna_core
      - name: Unit and isolated HTTP integration tests
        working-directory: core
        run: python -m unittest discover -s tests -v
      - name: Repository contracts
        run: python -m unittest discover -s tests -v
