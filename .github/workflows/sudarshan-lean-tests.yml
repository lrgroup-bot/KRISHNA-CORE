name: SUDARSHAN Lean Review Tests
on:
  push:
    branches: [feat/lr-lifecycle-integration-20261022]
    paths:
      - 'core/krishna_core/sudarshan_lean_review.py'
      - 'core/krishna_core/sudarshan_duplicate_review.py'
      - 'core/krishna_core/sudarshan_project_orchestrator.py'
      - 'core/tests/test_sudarshan_lean_review.py'
      - 'core/tests/test_sudarshan_duplicate_review.py'
      - '.github/workflows/sudarshan-lean-tests.yml'
  pull_request:
    paths:
      - 'core/krishna_core/sudarshan_lean_review.py'
      - 'core/krishna_core/sudarshan_duplicate_review.py'
      - 'core/krishna_core/sudarshan_project_orchestrator.py'
      - 'core/tests/test_sudarshan_lean_review.py'
      - 'core/tests/test_sudarshan_duplicate_review.py'
      - '.github/workflows/sudarshan-lean-tests.yml'
  workflow_dispatch:
jobs:
  lean-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile core/krishna_core/sudarshan_lean_review.py core/krishna_core/sudarshan_duplicate_review.py core/krishna_core/sudarshan_project_orchestrator.py
      - name: Unit tests
        env:
          PYTHONPATH: core
        run: python -m unittest discover -s core/tests -p 'test_sudarshan_*review.py' -v
