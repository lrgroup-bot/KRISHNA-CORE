name: Build SURYADEV AI Learner Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "standalone/suryadev/**"
      - "scripts/BUILD_SURYADEV_LEARNER_EXE.ps1"
      - "core/suryadev_worker.py"
      - "scripts/SURYDEV_VIDEO_LEARNING_ADAPTER.py"
      - ".github/workflows/suryadev-learner-windows-exe.yml"

permissions:
  contents: read

jobs:
  windows-learner-exe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and smoke test full offline-capable AI Learner
        shell: pwsh
        run: ./scripts/BUILD_SURYADEV_LEARNER_EXE.ps1 -Output ./dist-suryadev-learner
      - name: Upload full SURYADEV AI Learner EXE
        uses: actions/upload-artifact@v4
        with:
          name: SURYADEV-AI-LEARNER-WINDOWS-EXE
          path: dist-suryadev-learner/Suryadev-Learner/
          if-no-files-found: error
          retention-days: 14
