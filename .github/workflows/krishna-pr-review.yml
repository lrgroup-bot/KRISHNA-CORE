name: KRISHNA PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: krishna-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bounded-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile reviewer
        run: python -m py_compile scripts/KRISHNA_PR_REVIEW.py core/krishna_core/github_pr_review.py core/krishna_core/security.py
      - name: Run bounded KRISHNA PR review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/KRISHNA_PR_REVIEW.py
      - uses: actions/upload-artifact@v7
        with:
          name: krishna-pr-review
          path: krishna-pr-review.json
