name: Build KRISHNA Mobile Conversation APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/krishna-v3-live-avatar
      - feature/knag-pc-mobile
      - feature/mobile-pc-control-safe-patch
      - main
      - fix/krishna-ui-runtime-verification
      - fix/krishna-full-error-audit-v1
      - feature/bhumiputra-geovision-agent
  pull_request:
    paths:
      - 'mobile_v3/**'
      - 'app/src/main/res/**'
      - 'core/krishna_core/privacy_guardian/**'
      - 'core/tests/test_privacy_guardian.py'
      - 'core/krishna_core/project_perfection_execution.py'
      - 'core/tests/test_project_perfection_execution.py'
      - 'core/krishna_core/spark_x25.py'
      - 'core/krishna_core/remote_access.py'
      - 'core/krishna_core/device_pairing.py'
      - 'core/krishna_core/server.py'
      - 'core/krishna_core/gemini_hawkeye.py'
      - 'core/tests/test_spark_x25.py'
      - 'core/tests/test_full_audit_hardening.py'
      - '.github/workflows/build-mobile-v3.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/krishna/mobile
          mkdir -p app/src/main/res/{values,drawable,xml,raw}
          mkdir -p app/src/main/assets/three

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='KrishnaV3'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          org.gradle.workers.max=2
          org.gradle.daemon=false
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.krishna.mobile'
            compileSdk 35
            defaultConfig {
              applicationId 'com.krishna.mobile'
              minSdk 26
              targetSdk 35
              versionCode 38
              versionName '3.8.0'
            }
          }
          dependencies {
            implementation 'androidx.browser:browser:1.8.0'
            implementation 'com.google.mlkit:object-detection:17.0.2'
            implementation 'com.google.mlkit:text-recognition:16.0.1'
            implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
            implementation 'com.google.mlkit:barcode-scanning:17.3.0'
            implementation 'com.google.mlkit:face-detection:16.1.7'
            implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
            implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
            implementation 'com.google.mlkit:language-id:17.0.6'
            implementation 'com.google.mlkit:translate:17.0.3'
            implementation 'com.google.mediapipe:tasks-vision:1.0.0'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <string name="app_name">KRISHNA</string>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"/>
          </resources>
          EOF

          cat > app/src/main/res/xml/network_security_config.xml <<'EOF'
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors>
                <certificates src="system"/>
                <certificates src="user"/>
                <certificates src="@raw/krishna_ca"/>
              </trust-anchors>
            </base-config>
          </network-security-config>
          EOF

          cp app/src/main/res/raw/krishna-ca.cer app/src/main/res/raw/krishna_ca.cer
          rm -f app/src/main/res/raw/krishna-ca.cer
          cp app/src/main/res/drawable/krishna_hud.png app/src/main/res/drawable/krishna_hud_v3.png

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
            <application
              android:theme="@style/AppTheme"
              android:label="KRISHNA"
              android:icon="@drawable/krishna_hud_v3"
              android:usesCleartextTraffic="true"
              android:allowBackup="false"
              android:networkSecurityConfig="@xml/network_security_config">
              <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="subject_segment"/>
              <service android:name=".HawkeyeSyncJobService" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="false"/>
              <service android:name=".KrishnaWakeService" android:foregroundServiceType="microphone" android:exported="false"/>
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cp mobile_v3/*.java app/src/main/java/com/krishna/mobile/
          cp mobile_v3/index.html app/src/main/assets/index.html
          cp mobile_v3/realtime-client.js app/src/main/assets/realtime-client.js
          cp mobile_v3/hawkeye-observer-ui.js app/src/main/assets/hawkeye-observer-ui.js
          cp mobile_v3/CANONICAL_RUNTIME.json app/src/main/assets/canonical-runtime.json
          curl --retry 3 --fail --location --silent --show-error \
            "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/latest/gesture_recognizer.task" \
            -o app/src/main/assets/gesture_recognizer.task
          test -s app/src/main/assets/gesture_recognizer.task
          base64 -d avatar/krishna_child_360.webp.b64 > app/src/main/assets/krishna_child_360.webp

          npm init -y >/dev/null 2>&1
          npm install three@0.180.0 --no-save
          cp node_modules/three/build/three.module.js app/src/main/assets/three/three.module.js
          cp node_modules/three/examples/jsm/loaders/GLTFLoader.js app/src/main/assets/three/GLTFLoader.js
          sed -i "s/from 'three'/from '.\/three.module.js'/" app/src/main/assets/three/GLTFLoader.js

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify conversation-only KRISHNA Mobile
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -s app/src/main/assets/krishna_child_360.webp
          test -s app/src/main/assets/canonical-runtime.json
          grep -q '"version": "krishna-mobile-canonical-v1"' app/src/main/assets/canonical-runtime.json
          grep -q '"canonical_android_source": "mobile_v3"' app/src/main/assets/canonical-runtime.json
          grep -q '"package_id": "com.krishna.mobile"' app/src/main/assets/canonical-runtime.json
          grep -q '"HawkeyeOfflinePerception.java"' app/src/main/assets/canonical-runtime.json
          grep -q "krishna_child_360.webp" app/src/main/assets/index.html
          grep -q "SWIPE TO ROTATE" app/src/main/assets/index.html
          grep -q "showAvatarView" app/src/main/assets/index.html
          grep -q "hawkeye-observer-ui.js" app/src/main/assets/index.html
          node --check app/src/main/assets/hawkeye-observer-ui.js
          grep -q "PHOTO+DATA" app/src/main/assets/index.html
          grep -q "REC+DATA" app/src/main/assets/index.html
          grep -q "autoZoom" app/src/main/assets/hawkeye-observer-ui.js
          grep -q "hawkeyeObserveLearning" app/src/main/assets/hawkeye-observer-ui.js
          grep -q "hawkeyeResearchObservation" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "onResearchResult" app/src/main/assets/hawkeye-observer-ui.js
          grep -q "isLearning" app/src/main/assets/hawkeye-observer-ui.js
          grep -q '"hawkeye_rishi_live_research_handoff": true' app/src/main/assets/canonical-runtime.json
          grep -q "Conversation only" app/src/main/assets/index.html
          grep -q "verifyVoice" app/src/main/assets/index.html
          grep -q "startFieldScan" app/src/main/assets/index.html
          grep -q 'id="diagnosticOverlay"' app/src/main/assets/index.html
          grep -q "renderDiagnosticOverlay" app/src/main/assets/index.html
          grep -q "HAWKEYE · DIAGNOSTIC" app/src/main/assets/index.html
          grep -q "HAWKEYE · MOBILE BUFFER" app/src/main/assets/index.html
          grep -q "hawkeyeCurateFrame" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "HawkeyeEvidenceCuratorBot" app/src/main/java/com/krishna/mobile/HawkeyeEvidenceCuratorBot.java
          grep -q "MOBILE_MAX_BYTES=128L\*1024L\*1024L" app/src/main/java/com/krishna/mobile/HawkeyeEvidenceCuratorBot.java
          grep -q "MAX_SYNC_ITEMS_PER_TICK\|max_sync_items_per_tick" app/src/main/java/com/krishna/mobile/HawkeyeEvidenceCuratorBot.java
          grep -q "AES/GCM/NoPadding" app/src/main/java/com/krishna/mobile/HawkeyeCrypto.java
          grep -q "AndroidKeyStore" app/src/main/java/com/krishna/mobile/HawkeyeCrypto.java
          grep -q "setPeriodic(15L\*60L\*1000L)" app/src/main/java/com/krishna/mobile/HawkeyeBackgroundSync.java
          grep -q "setRequiresBatteryNotLow(true)" app/src/main/java/com/krishna/mobile/HawkeyeBackgroundSync.java
          grep -q "NETWORK_TYPE_UNMETERED" app/src/main/java/com/krishna/mobile/HawkeyeBackgroundSync.java
          grep -q "WAITING_FOR_TRUSTED_LAN" app/src/main/java/com/krishna/mobile/HawkeyeBackgroundSync.java
          grep -q "/api/hawkeye/media-sync/chunk" app/src/main/java/com/krishna/mobile/HawkeyeBackgroundSync.java
          grep -q "delete_after_verified_default" app/src/main/java/com/krishna/mobile/HawkeyeBackgroundSync.java
          grep -q "KrishnaPrivateCore.bootstrap" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "private_remote_url" app/src/main/java/com/krishna/mobile/KrishnaPrivateCore.java
          grep -q "KRISHNA_DISCOVER_V1" app/src/main/java/com/krishna/mobile/KrishnaPrivateCore.java
          grep -q '"large_media_sync_unmetered_only": true' app/src/main/assets/canonical-runtime.json
          grep -q '"large_media_same_lan_required": true' app/src/main/assets/canonical-runtime.json
          grep -q "trustedLanReady" app/src/main/java/com/krishna/mobile/HawkeyeBackgroundSync.java
          grep -q '"cellular_large_media_upload": false' app/src/main/assets/canonical-runtime.json
          grep -q '"delete_after_verified_default": false' app/src/main/assets/canonical-runtime.json
          grep -q "HawkeyeSyncJobService" app/src/main/AndroidManifest.xml
          grep -q 'android:exported="false"' app/src/main/AndroidManifest.xml
          grep -q "recordBoundedMedia" app/src/main/assets/index.html
          grep -q "videoBitsPerSecond:320000" app/src/main/assets/index.html
          grep -q "audioBitsPerSecond:48000" app/src/main/assets/index.html
          grep -q "hawkeyeCurateMedia" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "hawkeyeReference" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "configureReferenceAlignment" app/src/main/assets/index.html
          grep -q "REFERENCE LOCKED" app/src/main/assets/index.html
          grep -q "migrateLegacyPlaintext" app/src/main/java/com/krishna/mobile/HawkeyeEdgeMemory.java
          grep -q "/api/hawkeye/evidence/ingest" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "bhumiputraFrame" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "MobileEdgeBot.prepareFrame" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "KRISHNA_EDGE_BOT_V1" app/src/main/java/com/krishna/mobile/MobileEdgeBot.java
          grep -q "HawkeyeDeviceProfiler.profile" app/src/main/java/com/krishna/mobile/MobileEdgeBot.java
          grep -q "HawkeyeEdgeMemory.remember" app/src/main/java/com/krishna/mobile/MobileEdgeBot.java
          grep -q "edgeSamplingMs" app/src/main/assets/index.html
          grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          grep -q "hawkeyeOfflineFrame" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "hawkeyeDetectObjects" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "openResearchBrowser" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "saveHawkeyeCapture" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "ML_KIT_OBJECT_TRACKER" app/src/main/java/com/krishna/mobile/HawkeyeMobileVision.java
          grep -q "ML_KIT_LOCAL_RICH" app/src/main/java/com/krishna/mobile/HawkeyeMobileVision.java
          grep -q "hawkeyeRichPerception" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "hawkeyeGeminiAnalyze" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "hawkeyeFreeCloudAnalyze" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "/api/hawkeye/free-cloud/analyze" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "freeCloudTick" app/src/main/assets/hawkeye-observer-ui.js
          grep -q '"mobile_qwen": false' app/src/main/assets/canonical-runtime.json
          grep -q '"openrouter_zero_cost_role_routing": true' app/src/main/assets/canonical-runtime.json
          grep -q "hawkeyeGeminiLiveToken" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q 'id="cameraAI"' app/src/main/assets/index.html
          grep -q 'id="cameraGeminiLive"' app/src/main/assets/index.html
          grep -q "toggleGeminiLive" app/src/main/assets/hawkeye-observer-ui.js
          grep -q "richPerception" app/src/main/assets/hawkeye-observer-ui.js
          grep -q "hawkeyeTranslateText" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "ML_KIT_ON_DEVICE_TRANSLATE" app/src/main/java/com/krishna/mobile/HawkeyeLanguage.java
          grep -q 'id="cameraTranslate"' app/src/main/assets/index.html
          grep -q 'id="cameraGesture"' app/src/main/assets/index.html
          grep -q 'id="cameraTorch"' app/src/main/assets/index.html
          grep -q "captureBestFrame" app/src/main/assets/hawkeye-observer-ui.js
          grep -q "privacy_faces_masked" app/src/main/assets/hawkeye-observer-ui.js
          grep -q "MEDIAPIPE_GESTURE_RECOGNIZER" app/src/main/java/com/krishna/mobile/HawkeyeHandGesture.java
          grep -q "hawkeyeHandGesture" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "hawkeyeSensorSnapshot" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "ANDROID_SENSOR_MANAGER" app/src/main/java/com/krishna/mobile/HawkeyeSensorFusion.java
          grep -q "sensor_fusion" app/src/main/assets/hawkeye-observer-ui.js
          grep -q "spatial_handoff" app/src/main/assets/index.html
          test -s app/src/main/assets/gesture_recognizer.task
          grep -q "user-default-custom-tab" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "HawkeyeOfflinePerception.analyze" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "ANDROID_LOCAL_LIGHTWEIGHT_PROBE" app/src/main/java/com/krishna/mobile/HawkeyeOfflinePerception.java
          grep -q "semantic_model_configured" app/src/main/java/com/krishna/mobile/HawkeyeOfflinePerception.java
          grep -q "KrishnaWakeService" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "window.onKrishnaWake" app/src/main/assets/index.html
          grep -q "createOnDeviceSpeechRecognizer" app/src/main/java/com/krishna/mobile/KrishnaWakeService.java
          grep -q "wake_is_authentication" app/src/main/java/com/krishna/mobile/KrishnaWakeService.java
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="microphone"' app/src/main/AndroidManifest.xml
          grep -q "configureCloudUrl" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "secureCloudUrl" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "mobile_local_first:true" app/src/main/assets/index.html
          grep -q 'android.permission.CAMERA' app/src/main/AndroidManifest.xml
          grep -q "ensureChat" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "task.completed" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "device_credential" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "KRISHNA_DISCOVER_V1" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "setAllowUniversalAccessFromFileURLs(false)" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "privateCoreUrl" app/src/main/java/com/krishna/mobile/MainActivity.java
          grep -q "configurePc" app/src/main/assets/index.html
          grep -q 'id="voiceLang"' app/src/main/assets/index.html
          grep -q "or-IN" app/src/main/assets/index.html
          grep -q "hi-IN" app/src/main/assets/index.html
          grep -q "en-IN" app/src/main/assets/index.html
          grep -q "not-a-mobile-control-route" app/src/main/java/com/krishna/mobile/MainActivity.java
          python - <<'PY'
          from pathlib import Path
          mobile=Path("app/src/main/java/com/krishna/mobile/MainActivity.java").read_text(encoding="utf-8")
          core=mobile.split("String coreBase()throws Exception{",1)[1].split("@JavascriptInterface public String configureCoreUrl",1)[0]
          if "cloud_url" in core or "secureCloudUrl(cloud)" in core:
              raise SystemExit("KRISHNA Mobile control path leaked to a public cloud URL")
          print("KRISHNA_MOBILE_PRIVATE_CONTROL_OK")
          PY
          if grep -q "192\.168\.0\.106" app/src/main/java/com/krishna/mobile/MainActivity.java; then echo "stale hard-coded PC IP leaked into mobile build" >&2; exit 1; fi
          if grep -q "workspaceBtn\|runTool" app/src/main/assets/index.html; then echo "dashboard/tool UI leaked into conversation-only mobile" >&2; exit 1; fi

      - name: KABACH real APK privacy gate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=core python - <<'PY'
          import json
          from pathlib import Path
          from krishna_core.privacy_guardian.mobile import basic_apk_privacy_audit
          from krishna_core.privacy_guardian.policy import evaluate_release_gate

          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          report=basic_apk_privacy_audit(apk)
          wrapped={"target_type":"mobile","findings":report["findings"]}
          gate=evaluate_release_gate(wrapped,"MOBILE_RELEASE")
          findings={x["test"]:x for x in report["findings"]}
          permissions=findings["mobile.permissions"]
          trackers=findings["mobile.trackers.static"]["evidence"].get("tracker_signatures") or []
          cleartext=findings["mobile.cleartext_urls"]["evidence"].get("cleartext_hosts") or []
          if permissions["state"]=="unsupported":
              raise SystemExit("KABACH mobile gate: aapt2 permission scan was unavailable")
          if trackers:
              raise SystemExit("KABACH mobile gate: unexpected tracker signatures: "+",".join(trackers))
          if cleartext:
              raise SystemExit("KABACH mobile gate: non-loopback cleartext host strings: "+",".join(cleartext))
          if not gate["passed"]:
              raise SystemExit("KABACH mobile release gate failed: "+json.dumps(gate))
          Path("privacy-apk-report.json").write_text(json.dumps({
              "apk_sha256":report["apk_sha256"],"findings":report["findings"],"gate":gate,
          },indent=2),encoding="utf-8")
          print("KABACH_MOBILE_PRIVACY_GATE_OK")
          PY

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "/dev/kvm is unavailable on this runner" >&2
            exit 1
          fi
          ls -l /dev/kvm
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Clean APK emulator install-launch-restart retest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: PYTHONPATH=core python scripts/VERIFY_KRISHNA_APK.py app/build/outputs/apk/debug/app-debug.apk com.krishna.mobile

      - uses: actions/upload-artifact@v7
        with:
          name: KRISHNA-v3.8-HAWKEYE-Observer-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            privacy-apk-report.json
            project-perfection-apk-retest.json
