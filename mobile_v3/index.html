<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020914;color:#e9fbff;font-family:Arial,sans-serif}
.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 34%,#123e66aa,transparent 36%),linear-gradient(#061726,#020914)}
header{text-align:center;padding:16px 12px 7px}.brand{letter-spacing:7px;color:#f2c96f;font-size:22px;font-weight:900}.state{cursor:pointer;font-size:10px;color:#82a8b9;letter-spacing:2px;margin-top:7px}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.halo{position:absolute;width:min(68vw,330px);aspect-ratio:1;border:2px solid #f2c96f88;border-radius:50%;box-shadow:0 0 45px #43bff255,inset 0 0 35px #43bff222}
.avatarViewport{position:relative;height:min(57vh,540px);aspect-ratio:1/3;overflow:hidden;z-index:2;filter:drop-shadow(0 16px 22px #000a);user-select:none}
.sprite{height:100%;width:800%;display:block;transform:translateX(0);transition:transform .18s ease-out;pointer-events:none}
.viewLabel{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);z-index:4;font-size:9px;letter-spacing:2px;color:#f4d88b;background:#020914bb;border:1px solid #8b733c66;border-radius:20px;padding:5px 8px}
.bubble{position:absolute;right:14px;top:12px;z-index:5;max-width:64%;padding:9px 11px;border:1px solid #2c88ae;border-radius:15px 15px 4px;background:#061829dd;font-size:12px;line-height:1.35}
.rotateHint{position:absolute;left:14px;top:14px;z-index:5;font-size:9px;letter-spacing:1.4px;color:#7fb3c5}
.stage.working .halo{animation:pulse 1.2s infinite alternate}.stage.chat .halo{animation:pulse .7s infinite alternate}@keyframes pulse{from{transform:scale(.96);opacity:.65}to{transform:scale(1.03);opacity:1}}
.bottom{padding:8px 12px 14px}.reply{min-height:42px;max-height:18vh;overflow:auto;text-align:center;font-size:14px;line-height:1.4;padding:6px 10px;color:#dffaff;white-space:pre-wrap}
.composer{display:grid;grid-template-columns:42px 42px 42px 1fr 45px;gap:7px;background:#041623;border:1px solid #1d7998;border-radius:18px;padding:7px;align-items:center}
.cameraLayer{position:absolute;inset:0;z-index:8;background:#000;display:none}
.cameraLayer.active{display:block}
.cameraLayer video{width:100%;height:100%;object-fit:cover}
.diagnosticOverlay{position:absolute;inset:0;z-index:9;width:100%;height:100%;pointer-events:none}
.cameraHud{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#001018aa 0%,transparent 25%,transparent 65%,#001018cc 100%)}
.cameraTop{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.4px}
.cameraBadge{background:#041623dd;border:1px solid #45d4e8;border-radius:14px;padding:7px 10px}
.cameraAnalysis{position:absolute;left:12px;right:12px;bottom:18px;max-height:34%;overflow:auto;background:#03131ddd;border:1px solid #45d4e899;border-radius:12px;padding:10px;font-size:12px;line-height:1.35;white-space:pre-wrap}
.cameraClose{position:absolute;right:12px;top:48px;z-index:10;pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid #ff7189;background:#270812dd;color:#fff;font-size:18px}
.composer input[type=text]{min-width:0;background:transparent;color:#fff;border:0;outline:0;padding:10px}.composer select{max-width:74px;background:#061c29;color:#bdf9ff;border:1px solid #246173;border-radius:12px;padding:7px 4px;font-size:10px}.composer button{height:42px;border-radius:50%;border:1px solid #40dff4;background:#073148;color:#bdf9ff;font-size:17px}.composer .send{background:#116f87;color:#fff}.good{color:#50f0ac}.bad{color:#ff7189}.warn{color:#f2c96f}
.security{font-size:9px;text-align:center;color:#6f91a0;margin-top:7px;letter-spacing:.25px}
</style></head>
<body><div class="app">
<header><div class="brand">KRISHNA</div><div id="state" class="state" title="Tap to configure the private KRISHNA PC link" onclick="configurePc()">CONNECTING</div></header>
<section id="stage" class="stage">
  <div class="halo"></div><div id="rotateHint" class="rotateHint">SWIPE TO ROTATE · 360°</div>
  <div id="avatarViewport" class="avatarViewport"><img id="avatarSprite" class="sprite" src="krishna_child_360.webp" alt="KRISHNA child avatar"><div id="viewLabel" class="viewLabel">FRONT</div></div>
  <div id="bubble" class="bubble">Radhe Radhe. I am ready.</div>
  <div id="cameraLayer" class="cameraLayer">
    <video id="fieldVideo" autoplay playsinline muted></video>
    <canvas id="fieldCanvas" hidden></canvas>
    <canvas id="diagnosticOverlay" class="diagnosticOverlay"></canvas>
    <div class="cameraHud">
      <div class="cameraTop"><span id="cameraMode" class="cameraBadge">HAWKEYE · AUTO SCAN</span><span id="cameraCount" class="cameraBadge">FRAME 0</span></div>
      <div id="cameraAnalysis" class="cameraAnalysis">Point the camera at a hill, road, tower, building, bridge, or machinery.</div>
    </div>
    <button id="cameraClose" class="cameraClose" onclick="stopFieldScan()" aria-label="Stop Hawkeye scan">×</button>
  </div>
</section>
<footer class="bottom">
 <div id="reply" class="reply">Talk to KRISHNA.</div>
 <div class="composer">
   <button onclick="startFieldScan()" aria-label="Hawkeye live camera scan">◉</button>
   <button onclick="document.getElementById('attach').click()" aria-label="Attach photo or file">＋</button>
   <input id="attach" type="file" accept="image/*,.pdf,.txt,.md,.json" capture="environment" hidden onchange="attachFile(this)">
   <button onclick="listen()" aria-label="Talk to KRISHNA">🎙</button>
   <select id="voiceLang" aria-label="Conversation language"><option value="or-IN">ଓଡ଼ିଆ</option><option value="hi-IN">हिन्दी</option><option value="en-IN">EN</option></select>
   <input id="msg" type="text" placeholder="Talk to KRISHNA…" onkeydown="if(event.key==='Enter')send()">
   <button class="send" onclick="send()" aria-label="Send">➤</button>
 </div>
 <div class="security">Conversation only · owner voice gate is local · sensitive actions still require device authorization</div>
</footer>
</div>
<script src="realtime-client.js"></script>
<script>
const labels=['FRONT','FRONT-RIGHT','RIGHT','BACK-RIGHT','BACK','BACK-LEFT','LEFT','FRONT-LEFT'];
let view=0,drag=false,startX=0,startView=0,mode='FLUTE',lastManual=0,autoTimer=null,busy=false,pendingAttachmentIds=[],pairingRequestedAt=0;
let fieldStream=null,fieldTimer=null,fieldSession='',fieldBusy=false,fieldFrames=0,fieldGoal='automatic live field scan',fieldAudio=false,fieldProbe=null,fieldVideoClipTimer=null,fieldAudioClipTimer=null,fieldMediaBusy=false;
const stage=document.getElementById('stage'),sprite=document.getElementById('avatarSprite'),label=document.getElementById('viewLabel'),vp=document.getElementById('avatarViewport');
function showAvatarView(i,manual=false){view=(i%8+8)%8;sprite.style.transform='translateX('+(-view*12.5)+'%)';label.textContent=labels[view];if(manual)lastManual=Date.now()}
function step(delta,manual=true){showAvatarView(view+delta,manual)}
vp.addEventListener('pointerdown',e=>{drag=true;startX=e.clientX;startView=view;vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(!drag)return;showAvatarView(startView+Math.round(-(e.clientX-startX)/34),true)});
vp.addEventListener('pointerup',()=>drag=false);vp.addEventListener('pointercancel',()=>drag=false);
function startAuto(){clearInterval(autoTimer);autoTimer=setInterval(()=>{if(mode==='FLUTE'&&Date.now()-lastManual>4500&&!drag)step(1,false)},2600)}
function setMode(m,text){mode=m||'FLUTE';document.getElementById('state').textContent=mode;stage.classList.toggle('working',mode==='WORKING'||mode==='SEARCH'||mode==='DHYAN');stage.classList.toggle('chat',mode==='CHAT'||mode==='TALKING'||mode==='LISTENING');if(text)document.getElementById('bubble').textContent=text;if(mode==='CHAT'||mode==='TALKING'||mode==='LISTENING')showAvatarView(0,false);else if(mode==='WORKING')showAvatarView(1,false);else if(mode==='SEARCH'||mode==='DHYAN')showAvatarView(2,false)}
function reply(text,cls=''){const e=document.getElementById('reply');e.className='reply '+cls;e.textContent=text}
function speechLocale(text=''){const value=String(text||'');if(/[\u0B00-\u0B7F]/.test(value))return'or-IN';if(/[\u0900-\u097F]/.test(value))return'hi-IN';return document.getElementById('voiceLang')?.value||'en-IN'}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=speechLocale(t);speechSynthesis.speak(u)}catch(e){}}

window.send=()=>{const i=document.getElementById('msg'),q=i.value.trim();if(!q||busy)return;i.value='';busy=true;setMode('WORKING','KRISHNA is working…');reply('KRISHNA is thinking…');setTimeout(()=>{try{const ready=JSON.parse(Krishna.ensureChat());if(ready.error)throw new Error(ready.error);const d=JSON.parse(Krishna.chatWithAttachments(q,JSON.stringify(pendingAttachmentIds.slice(0,3))));if(d.error)throw new Error(d.error);pendingAttachmentIds=[];const text=d.reply||d.text||'Done';reply(text);setMode(d.avatar_state||'TALKING',text);speak(text)}catch(e){reply(e.message,'bad');setMode('CHAT','Connection error')}finally{busy=false}},20)}

window.listen=()=>{if(busy)return;if(!Krishna.voiceEnrolled()){reply('Say a natural sentence for a few seconds to create your local owner voice gate.','warn');setTimeout(()=>{const d=JSON.parse(Krishna.enrollVoice());if(d.error){reply(d.error,'bad');return}reply('Owner voice gate enrolled locally. Tap the microphone again and say “Krishna” before your request.','good')},80);return}
 reply('Say “Krishna” to verify the local owner voice gate…','warn');setMode('LISTENING','OWNER CHECK');
 setTimeout(()=>{const v=JSON.parse(Krishna.verifyVoice());if(v.error){reply(v.error,'bad');setMode('CHAT','VOICE ERROR');return}if(!v.matched){reply('Voice gate did not match. Type your request or try again.','bad');setMode('CHAT','VOICE NOT MATCHED');return}
   const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(!Recognition){reply('Speech recognition is unavailable on this device; type your request.','bad');return}
   const r=new Recognition();r.lang=document.getElementById('voiceLang')?.value||'or-IN';r.interimResults=true;r.onstart=()=>setMode('LISTENING','LISTENING');r.onresult=e=>{let t='';for(let k=e.resultIndex;k<e.results.length;k++)t+=e.results[k][0].transcript;reply(t);if(e.results[e.results.length-1].isFinal){document.getElementById('msg').value=t.replace(/^(krishna|कृष्ण|କୃଷ୍ଣ)[ ,]*/i,'');send()}};r.onerror=e=>reply('Voice: '+e.error,'bad');r.start();
 },20)
}

function clearDiagnosticOverlay(){
 const canvas=document.getElementById('diagnosticOverlay');if(!canvas)return;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
}
function renderDiagnosticOverlay(result){
 const canvas=document.getElementById('diagnosticOverlay'),video=document.getElementById('fieldVideo');
 if(!canvas||!video)return;const overlay=result&&result.overlay;if(!overlay){clearDiagnosticOverlay();return}
 const cw=canvas.clientWidth||video.clientWidth,ch=canvas.clientHeight||video.clientHeight;if(!cw||!ch||!video.videoWidth||!video.videoHeight)return;
 const dpr=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);
 const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);
 const scale=Math.max(cw/video.videoWidth,ch/video.videoHeight),dw=video.videoWidth*scale,dh=video.videoHeight*scale,ox=(cw-dw)/2,oy=(ch-dh)/2;
 const rect=b=>({x:ox+(Number(b[0])||0)*dw,y:oy+(Number(b[1])||0)*dh,w:(Number(b[2])||0)*dw,h:(Number(b[3])||0)*dh});
 const components=new Map();ctx.lineWidth=1.8;ctx.font='12px sans-serif';ctx.textBaseline='bottom';
 for(const item of overlay.components||[]){if(!Array.isArray(item.bbox)||item.bbox.length!==4)continue;const r=rect(item.bbox);components.set(String(item.id),r);ctx.strokeStyle='#45d4e8';ctx.fillStyle='#45d4e8';ctx.strokeRect(r.x,r.y,r.w,r.h);ctx.fillText(String(item.label||item.id||'component').slice(0,24),r.x+3,Math.max(14,r.y-2))}
 const center=r=>({x:r.x+r.w/2,y:r.y+r.h/2});
 for(const flow of overlay.flows||[]){const a=components.get(String(flow.from)),b=components.get(String(flow.to));if(!a||!b)continue;const p=center(a),q=center(b),ang=Math.atan2(q.y-p.y,q.x-p.x);ctx.strokeStyle='#f2c96f';ctx.fillStyle='#f2c96f';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-10*Math.cos(ang-.5),q.y-10*Math.sin(ang-.5));ctx.lineTo(q.x-10*Math.cos(ang+.5),q.y-10*Math.sin(ang+.5));ctx.closePath();ctx.fill();const label=String(flow.label||'').slice(0,16);if(label)ctx.fillText(label,(p.x+q.x)/2+4,(p.y+q.y)/2-3)}
 for(const tp of overlay.test_points||[]){let p=null;if(Array.isArray(tp.bbox)&&tp.bbox.length===4){const r=rect(tp.bbox);p=center(r)}else{const r=components.get(String(tp.component_id||''));if(r)p=center(r)}if(!p)continue;ctx.strokeStyle='#50f0ac';ctx.fillStyle='#50f0ac';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.stroke();ctx.fillText(String(tp.label||'TEST').slice(0,16),p.x+9,p.y-2)}
}

function visualProbe(video){
 const probe=document.createElement('canvas');probe.width=32;probe.height=24;const ctx=probe.getContext('2d',{alpha:false,willReadFrequently:true});ctx.drawImage(video,0,0,32,24);
 const data=ctx.getImageData(0,0,32,24).data,lum=new Float32Array(32*24);let mean=0,edge=0,k=0;
 for(let i=0;i<data.length;i+=4){const y=.2126*data[i]+.7152*data[i+1]+.0722*data[i+2];lum[k++]=y;mean+=y}mean/=lum.length;
 for(let y=0;y<24;y++)for(let x=0;x<32;x++){const i=y*32+x;if(x)edge+=Math.abs(lum[i]-lum[i-1]);if(y)edge+=Math.abs(lum[i]-lum[i-32])}
 edge/=((31*24)+(23*32));const exposure=Math.max(0,1-Math.abs(mean-128)/118),detail=Math.min(1,edge/24);
 let novelty=1;if(fieldProbe&&fieldProbe.length===lum.length){let delta=0;for(let i=0;i<lum.length;i++)delta+=Math.abs(lum[i]-fieldProbe[i]);novelty=Math.min(1,(delta/lum.length)/70)}
 fieldProbe=lum;return{quality:Math.max(0,Math.min(1,.45*exposure+.55*detail)),novelty};
}

function hawkeyeDiagnosticGoal(){const s=String(fieldGoal||'').toLowerCase();return /diagnos|fault|circuit|pcb|motherboard|vehicle|truck|car|bus|bike|machine|motor|bearing|damage|broken|error/.test(s)}
function hawkeyeSoundGoal(){const s=String(fieldGoal||'').toLowerCase();return /sound|noise|bearing|engine|motor|vibration/.test(s)}
function supportedRecorderType(modality){
 const choices=modality==='audio'?['audio/webm;codecs=opus','audio/webm','audio/mp4']:['video/webm;codecs=vp8,opus','video/webm','video/mp4'];
 if(typeof MediaRecorder==='undefined')return'';for(const t of choices)try{if(MediaRecorder.isTypeSupported(t))return t}catch(_){}return'';
}
function blobBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(r.error||new Error('media read failed'));r.onload=()=>resolve(String(r.result||'').split(',')[1]||'');r.readAsDataURL(blob)})}
async function recordBoundedMedia(modality,durationMs){
 if(fieldMediaBusy||!fieldStream||!fieldSession||!hawkeyeDiagnosticGoal())return;const mime=supportedRecorderType(modality);if(!mime)return;
 const tracks=modality==='audio'?fieldStream.getAudioTracks():[...fieldStream.getVideoTracks(),...fieldStream.getAudioTracks()];if(!tracks.length)return;
 fieldMediaBusy=true;const clones=tracks.map(t=>t.clone());const stream=new MediaStream(clones);const chunks=[];
 try{
   const opts=modality==='audio'?{mimeType:mime,audioBitsPerSecond:48000}:{mimeType:mime,videoBitsPerSecond:320000,audioBitsPerSecond:48000};
   const rec=new MediaRecorder(stream,opts);rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
   const done=new Promise((resolve,reject)=>{rec.onerror=e=>reject(e.error||new Error('media recorder failed'));rec.onstop=resolve});rec.start();setTimeout(()=>{try{if(rec.state!=='inactive')rec.stop()}catch(_){}},durationMs);await done;
   const blob=new Blob(chunks,{type:rec.mimeType||mime});const max=modality==='audio'?1024*1024:4*1024*1024;if(!blob.size||blob.size>max)return;
   const b64=await blobBase64(blob),sensors={timestamp_ms:Date.now(),mobile_local_first:true,bounded_clip:true,duration_ms:durationMs};
   const d=JSON.parse(Krishna.hawkeyeCurateMedia(fieldSession,b64,blob.type||mime,modality,JSON.stringify(sensors),fieldGoal,0.55));
   if(d.pc_acknowledged&&d.specialist_dispatch)document.getElementById('cameraAnalysis').textContent+=(document.getElementById('cameraAnalysis').textContent?'\n\n':'')+'Specialist: '+String(d.specialist_dispatch.status||'queued');
 }catch(_){ }finally{for(const t of clones)try{t.stop()}catch(_){}fieldMediaBusy=false}
}
function startBoundedMediaCapture(){
 clearInterval(fieldVideoClipTimer);clearInterval(fieldAudioClipTimer);if(typeof MediaRecorder==='undefined'||!hawkeyeDiagnosticGoal())return;
 fieldVideoClipTimer=setInterval(()=>recordBoundedMedia('video',4000),30000);setTimeout(()=>recordBoundedMedia('video',4000),6500);
 if(fieldAudio&&hawkeyeSoundGoal()){fieldAudioClipTimer=setInterval(()=>recordBoundedMedia('audio',3000),20000);setTimeout(()=>recordBoundedMedia('audio',3000),12000)}
}

async function startFieldScan(){
 if(fieldStream||fieldBusy)return;
 try{
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Live camera is unavailable on this device.');
   fieldGoal=(prompt('What should Hawkeye inspect?','automatic live field scan')||'automatic live field scan').trim();
   let start={}; let offline=false;
   try{start=JSON.parse(Krishna.bhumiputraStart(fieldGoal,'auto'));if(start.error)throw new Error(start.error)}
   catch(_){offline=true;start={session_id:'offline-'+Date.now()}}
   fieldSession=start.session_id||('offline-'+Date.now());
   window.hawkeyeOffline=offline;
   fieldStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:true});
   fieldAudio=fieldStream.getAudioTracks().length>0;
   const video=document.getElementById('fieldVideo');video.srcObject=fieldStream;
   document.getElementById('cameraLayer').classList.add('active');
   document.getElementById('cameraAnalysis').textContent='Hawkeye live scan started. Hold the camera steady and move around the object for additional viewpoints.';
   document.getElementById('cameraMode').textContent='HAWKEYE · AUTO SCAN';
   clearDiagnosticOverlay();
   fieldFrames=0;fieldProbe=null;setMode('WORKING','HAWKEYE LIVE');
   clearInterval(fieldTimer);fieldTimer=setInterval(sampleFieldFrame,5000);
   startBoundedMediaCapture();setTimeout(sampleFieldFrame,700);
 }catch(e){
   reply('Hawkeye camera: '+e.message,'bad');
   stopFieldScan();
 }
}
async function sampleFieldFrame(){
 if(!fieldStream||fieldBusy||!fieldSession)return;
 const video=document.getElementById('fieldVideo');
 if(!video.videoWidth||!video.videoHeight)return;
 fieldBusy=true;
 try{
   const canvas=document.getElementById('fieldCanvas');
   const metrics=visualProbe(video);
   const maxW=720,scale=Math.min(1,maxW/video.videoWidth);
   canvas.width=Math.max(1,Math.round(video.videoWidth*scale));
   canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
   canvas.getContext('2d',{alpha:false}).drawImage(video,0,0,canvas.width,canvas.height);
   const dataUrl=canvas.toDataURL('image/jpeg',0.62);
   const b64=dataUrl.split(',')[1]||'';
   const sensors={timestamp_ms:Date.now(),orientation:'mobile-camera',frame_width:canvas.width,frame_height:canvas.height,mobile_local_first:true,quality:metrics.quality,novelty:metrics.novelty};
   const d=JSON.parse(Krishna.hawkeyeCurateFrame(fieldSession,b64,'image/jpeg',JSON.stringify(sensors),fieldGoal,metrics.quality,metrics.novelty));
   if(d.error)throw new Error(d.error);
   fieldFrames+=1;
   document.getElementById('cameraCount').textContent='FRAME '+fieldFrames;
   document.getElementById('cameraAnalysis').textContent=d.analysis||'Mobile curator processed frame.';
   if(d.pc_acknowledged)renderDiagnosticOverlay(d);
   const curator=d.curator||{};
   if(!d.pc_acknowledged){document.getElementById('cameraMode').textContent=d.stored_local?'HAWKEYE · MOBILE BUFFER':'HAWKEYE · EDGE FILTER';}
   if(d.diagnostic){
     document.getElementById('cameraMode').textContent='HAWKEYE · DIAGNOSTIC';
     const notes=[];if(d.accuracy_note)notes.push(d.accuracy_note);for(const w of d.warnings||[])notes.push('WARNING: '+w);
     if(notes.length)document.getElementById('cameraAnalysis').textContent+=(d.analysis?'\n\n':'')+notes.join('\n');
   }
   if(d.pc_acknowledged){try{
     const modalities=fieldAudio?['image','video','audio']:['image','video'];
     const learned=JSON.parse(Krishna.hawkeyeLearnCapture(fieldGoal,'mobile_curated_evidence',fieldSession,JSON.stringify(modalities),'live scene',String(d.analysis||''),Number(d.confidence||0),String(d.evidence_state||'OBSERVED'),JSON.stringify({live_microphone:fieldAudio,timestamp_ms:Date.now()})));
     if(learned.unknown_resolution)document.getElementById('cameraAnalysis').textContent+=(d.analysis?'\n\n':'')+'Learning escalation: '+learned.unknown_resolution.rishi+' · '+learned.unknown_resolution.status;
   }catch(_){}}
   if(!d.pc_acknowledged||d.diagnostic)return;
   const a=String(d.analysis||'').toLowerCase();
   let scene='AUTO';
   if(a.includes('tower')||a.includes('building')||a.includes('structure')||a.includes('bridge'))scene='STRUCTURE';
   else if(a.includes('road')||a.includes('track'))scene='ROAD';
   else if(a.includes('hill')||a.includes('rock')||a.includes('terrain')||a.includes('quarry'))scene='TERRAIN';
   else if(a.includes('machinery')||a.includes('truck')||a.includes('excavator'))scene='MACHINERY';
   document.getElementById('cameraMode').textContent='HAWKEYE · '+scene;
 }catch(e){
   document.getElementById('cameraAnalysis').textContent='Scan warning: '+e.message;
 }finally{fieldBusy=false}
}
function stopFieldScan(){
 clearInterval(fieldTimer);fieldTimer=null;clearInterval(fieldVideoClipTimer);fieldVideoClipTimer=null;clearInterval(fieldAudioClipTimer);fieldAudioClipTimer=null;
 if(fieldStream){for(const t of fieldStream.getTracks())try{t.stop()}catch(e){}}
 fieldStream=null;fieldBusy=false;fieldAudio=false;fieldProbe=null;fieldMediaBusy=false;
 clearDiagnosticOverlay();
 document.getElementById('fieldVideo').srcObject=null;
 document.getElementById('cameraLayer').classList.remove('active');
 if(fieldSession){reply('Hawkeye live scan stopped. Session '+fieldSession.slice(0,8)+' preserved locally.','good')}
 fieldSession='';setMode('CHAT','FIELD SCAN SAVED');
}
window.startFieldScan=startFieldScan;window.stopFieldScan=stopFieldScan;

window.attachFile=input=>{const file=input.files&&input.files[0];if(!file)return;if(file.size>25*1024*1024){reply('Attachment exceeds 25 MB.','bad');input.value='';return}reply('Attaching '+file.name+'…','warn');const reader=new FileReader();reader.onload=()=>{try{const ready=JSON.parse(Krishna.ensureChat());if(ready.error)throw new Error(ready.error);const b64=String(reader.result).split(',')[1]||'';const d=JSON.parse(Krishna.attach(file.name,file.type||'application/octet-stream',b64));if(d.error)throw new Error(d.error);if(d.attachment_id)pendingAttachmentIds.push(d.attachment_id);reply('Attached '+file.name+'. It will be included in your next KRISHNA request.','good')}catch(e){reply(e.message,'bad')}finally{input.value=''}};reader.readAsDataURL(file)}

function configurePc(){
 try{
   const current=(Krishna.coreUrl&&Krishna.coreUrl())||'';
   const value=prompt('KRISHNA PC private address (LAN or Tailscale), for example http://192.168.1.10:8766',current);
   if(value===null)return;
   const d=JSON.parse(Krishna.configureCoreUrl(value));
   if(d.error)throw new Error(d.error);
   pairingRequestedAt=0;
   document.getElementById('state').textContent='CONNECTING';
   document.getElementById('state').className='state warn';
   reply('Private PC link saved. KRISHNA will pair without a code.','good');
   setTimeout(poll,100);
 }catch(e){reply(e.message,'bad')}
}

function poll(){try{const link=JSON.parse(Krishna.connection());if(link.error||!link.connected){if(Date.now()-pairingRequestedAt>15000){pairingRequestedAt=Date.now();try{const p=JSON.parse(Krishna.pairingRequest());if(!p.error){document.getElementById('state').textContent='WAITING FOR PC APPROVAL';document.getElementById('state').className='state warn';reply('Pairing request sent securely. Approve this phone once in KRISHNA PC System. No code is required.','warn');return}}catch(_){}}throw new Error(link.error||'Backend link not confirmed')}const d=JSON.parse(Krishna.state());if(d.error)throw new Error(d.error);setMode(d.operator?.avatar_state||'FLUTE',d.operator?.current?.task||'Radhe Radhe. I am ready.');document.getElementById('state').className='state good'}catch(e){if(document.getElementById('state').textContent!=='WAITING FOR PC APPROVAL')document.getElementById('state').textContent='PC OFFLINE';document.getElementById('state').className=document.getElementById('state').textContent==='WAITING FOR PC APPROVAL'?'state warn':'state bad'}}
showAvatarView(0);startAuto();poll();setInterval(poll,5000);
const realtime=new KrishnaRealtime(Krishna);
realtime.onEvent=e=>{const p=e.payload||{};if(e.type==='task.completed'){reply(p.summary||'KRISHNA completed the task','good');setMode('CHAT','WORK COMPLETED');return}if(e.type==='action.sync'){const status=String(p.status||'').toUpperCase(),action=String(p.action||'KRISHNA action');if(status==='COMPLETED')setMode('CHAT',action+' · SYNCED');else if(status==='FAILED'||status==='BLOCKED')setMode('CHAT',action+' · '+status);else setMode('WORKING',action)}};
realtime.onState=s=>{if(s==='reconnecting')document.getElementById('state').textContent='RECONNECTING'};
realtime.start();window.onerror=(m,s,l)=>{try{Krishna.log('JS '+m+' '+s+':'+l)}catch(e){}};
