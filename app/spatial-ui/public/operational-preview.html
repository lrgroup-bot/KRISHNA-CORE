<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRISHNA Spatial Command OS Candidate</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070b;color:#edf6f8;font-family:Inter,Segoe UI,Arial,sans-serif}
#candidate{display:block;width:100%;height:100%;border:0;background:#02070b}
#candidateState{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 22px;border:1px solid #6ecbdd55;border-radius:18px;background:#081a24f2;box-shadow:0 24px 70px #000b;text-align:center;max-width:540px}
#candidateState b{display:block;color:#e8c870;margin-bottom:7px;letter-spacing:.03em}#candidateState small{color:#8faab4;line-height:1.5}
</style>
</head>
<body>
<div id="candidateState"><b>Preparing KRISHNA Spatial Command OS…</b><small>The verified dashboard is preserved. This candidate applies the new owner-readable command deck, universal system dashboards and professional 3D system rail without promoting anything to live runtime.</small></div>
<iframe id="candidate" title="KRISHNA Spatial Command OS candidate" src="legacy-dashboard.html"></iframe>
<script>
(() => {
  const frame=document.getElementById('candidate');
  const state=document.getElementById('candidateState');
  let decorating=false,decorated=false;
  const assetUrl=name=>new URL(name,location.href).href;
  const loadText=async name=>{
    const response=await fetch(assetUrl(name),{cache:'no-store',credentials:'same-origin'});
    if(!response.ok)throw new Error(name+' HTTP '+response.status);
    return response.text();
  };
  const waitReady=async()=>{
    for(let i=0;i<80;i++){
      if(frame.contentWindow?.KRISHNA_OPERATIONAL_UI?.version==='2026.10-spatial-command-os-v1')return true;
      await new Promise(resolve=>setTimeout(resolve,50));
    }
    throw new Error('Spatial Command OS overlay did not initialize');
  };
  const fail=error=>{
    decorating=false;decorated=false;frame.dataset.spatialReady='0';state.hidden=false;
    state.innerHTML='<b>Spatial Command OS candidate failed safely</b><small>'+String(error?.message||error)+'<br>The verified dashboard has not been promoted or changed.</small>';
  };
  const decorate=async()=>{
    if(decorating||decorated)return;
    const doc=frame.contentDocument;
    if(!doc?.documentElement||!doc.head||!doc.body)return;
    decorating=true;
    try{
      const [cssText,jsText]=await Promise.all([
        loadText('operational-dashboard.css'),loadText('operational-dashboard.js')
      ]);
      doc.querySelectorAll('[data-krishna-spatial-command-os]').forEach(node=>node.remove());
      const style=doc.createElement('style');style.dataset.krishnaSpatialCommandOs='css';style.textContent=cssText;doc.head.appendChild(style);
      const script=doc.createElement('script');script.dataset.krishnaSpatialCommandOs='js';script.textContent=jsText;doc.body.appendChild(script);
      await waitReady();
      decorating=false;decorated=true;frame.dataset.spatialReady='1';state.hidden=true;
    }catch(error){fail(error)}
  };
  frame.addEventListener('load',()=>{decorate()});
  const probe=()=>{
    try{
      const ready=frame.contentDocument?.readyState;
      if(ready==='complete'||ready==='interactive')decorate();
    }catch(error){fail(error)}
  };
  queueMicrotask(probe);
  setTimeout(probe,100);
})();
</script>
</body>
</html>
